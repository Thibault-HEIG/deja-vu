<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Color picker HSV</title>
    <style>
        .hsv-picker {
            width: 260px;
            font-family: sans-serif;
        }

        /* Carré saturation / luminosité */
        .hsv-picker .zone {
            position: relative;
            width: 260px;
            height: 200px;
            cursor: crosshair;
            touch-action: none;
        }

        .hsv-picker canvas {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            display: block;
        }

        .hsv-picker .rond {
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 2px black;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Curseur de teinte */
        .hsv-picker input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 7px;
            margin: 12px 0;
            outline: none;
        }

        .hsv-picker input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            cursor: pointer;
        }

        .hsv-picker input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            cursor: pointer;
        }

        .hsv-picker .apercu {
            height: 40px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="hsv-picker">
        <div class="zone" id="zone">
            <canvas id="carre" width="260" height="200"></canvas>
            <div class="rond" id="rond"></div>
        </div>

        <input type="range" id="h" name="hue">

        <!-- Valeurs envoyées avec le formulaire -->
        <input type="hidden" id="s" name="saturation">
        <input type="hidden" id="v" name="brightness">

        <div class="apercu" id="apercu"></div>
        <p id="valeurs"></p>
    </div>

    <script>
        // ===== Limites à choisir ici =====
        const LIMITES = {
            h: [0, 360],   // teinte en degrés
            s: [20, 100],  // saturation en %
            v: [30, 100]   // luminosité en %
        };

        // Couleur de départ
        let h = 180;
        let s = 60;
        let v = 80;

        const canvas = document.getElementById('carre');
        const ctx = canvas.getContext('2d');
        const zone = document.getElementById('zone');
        const rond = document.getElementById('rond');
        const hInput = document.getElementById('h');

        hInput.min = LIMITES.h[0];
        hInput.max = LIMITES.h[1];
        hInput.value = h;

        // Convertit HSV (h : 0-360, s et v : 0-100) en [r, g, b]
        function hsvToRgb(h, s, v) {
            s = s / 100;
            v = v / 100;
            function f(n) {
                const k = (n + h / 60) % 6;
                return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))));
            }
            return [f(5), f(3), f(1)];
        }

        function css(rgb) {
            return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        }

        // Dessine le carré : saturation de gauche à droite, luminosité de bas en haut
        function dessinerCarre() {
            const largeur = canvas.width;
            const hauteur = canvas.height;
            const image = ctx.createImageData(largeur, hauteur);

            for (let y = 0; y < hauteur; y++) {
                const lum = LIMITES.v[1] - (LIMITES.v[1] - LIMITES.v[0]) * y / (hauteur - 1);
                for (let x = 0; x < largeur; x++) {
                    const sat = LIMITES.s[0] + (LIMITES.s[1] - LIMITES.s[0]) * x / (largeur - 1);
                    const rgb = hsvToRgb(h, sat, lum);
                    const i = (y * largeur + x) * 4;
                    image.data[i] = rgb[0];
                    image.data[i + 1] = rgb[1];
                    image.data[i + 2] = rgb[2];
                    image.data[i + 3] = 255;
                }
            }
            ctx.putImageData(image, 0, 0);
        }

        // Dégradé du curseur de teinte entre son min et son max
        function dessinerTeinte() {
            const couleurs = [];
            for (let i = 0; i <= 12; i++) {
                const teinte = LIMITES.h[0] + (LIMITES.h[1] - LIMITES.h[0]) * i / 12;
                couleurs.push(css(hsvToRgb(teinte, 100, 100)));
            }
            hInput.style.background = 'linear-gradient(to right, ' + couleurs.join(', ') + ')';
        }

        // Met à jour le rond, l'aperçu et les champs cachés
        function afficher() {
            const x = (s - LIMITES.s[0]) / (LIMITES.s[1] - LIMITES.s[0]);
            const y = (LIMITES.v[1] - v) / (LIMITES.v[1] - LIMITES.v[0]);
            rond.style.left = (x * 100) + '%';
            rond.style.top = (y * 100) + '%';

            document.getElementById('apercu').style.background = css(hsvToRgb(h, s, v));
            document.getElementById('s').value = s;
            document.getElementById('v').value = v;
            document.getElementById('valeurs').textContent =
                'Teinte ' + h + '° · Saturation ' + s + ' % · Luminosité ' + v + ' %';
        }

        // Clic ou glisser dans le carré
        function choisir(event) {
            const bord = zone.getBoundingClientRect();
            let x = (event.clientX - bord.left) / bord.width;
            let y = (event.clientY - bord.top) / bord.height;
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));

            s = Math.round(LIMITES.s[0] + (LIMITES.s[1] - LIMITES.s[0]) * x);
            v = Math.round(LIMITES.v[1] - (LIMITES.v[1] - LIMITES.v[0]) * y);
            afficher();
        }

        zone.addEventListener('pointerdown', function (event) {
            zone.setPointerCapture(event.pointerId);
            choisir(event);
        });
        zone.addEventListener('pointermove', function (event) {
            if (zone.hasPointerCapture(event.pointerId)) {
                choisir(event);
            }
        });

        hInput.addEventListener('input', function () {
            h = Number(hInput.value);
            dessinerCarre();
            afficher();
        });

        dessinerTeinte();
        dessinerCarre();
        afficher();
    </script>

</body>
</html>
